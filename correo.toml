#:schema ./schemas/correo.schema.json
# correo.toml — correo 自身の設定（dogfood）。`correo check` が cwd から根へ辿って自動発見する。
# 上の #:schema は taplo / tombi（TOML の language server）が読む directive — biome.json の
# "$schema" と同じ役割で、エディタ補完と検証が効く（correo 自身は無視する・ただのコメント）。
#
# allow への登録は judge（人か LLM）の裁定を経た語だけ。登録は造語の逃げ場ではない —
# 書き直せる語は書き直す。撤回の記録（2026-07-09）: 機械床・判定床・木下軸・行群・層別・家造語・
# 機械判定可能層 は登録や本文使用が却下され、標準的な日本語へ書き直した。
# 一回きりの言及は登録せず inline 抑制（<!-- correo-ignore -->）で逃がす。

allow = [
  # 製品・検出器の名前
  "correo", "codemix", "coinage", "kinoshita", "calque", "sudachi", "prh",
  # 分野の用語
  "slop", "locate", "judge", "llm-judge", "advisory", "blocking", "severity",
  "finding", "schema", "structured output", "allow-list", "latin", "code-switching",
  "domain", "pinned", "gratuitous", "tier", "proxy", "flag", "emit",
  "fence", "inline", "bullet", "exit", "output", "code", "cwd", "directive",
  # 他製品・形式の名前（README が言及する）
  "biome", "taplo", "tombi", "cargo", "mise", "rust", "toml", "json",
  "vale", "textlint", "node", "js", "go", "lint",
  # 書き換えずに使うと裁定した語（俗称として定着・言い換えると通じない）
  "ルー語", "ルー語密度",
  # 実在する複合語だが Sudachi の C 単位に無い語（strict の既知の誤検出）
  "日本語実用文", "実用文", "見出し語", "混種語", "登録語", "生成文", "字未満",
  "辞書見出し語", "辞書外複合",
]

# deny は「実在するが使わないと決めた語」の house rule 用（例: くだけた話し言葉の禁止）。
# 造語（機械床 等）はここに書かない — corpus 照合が proactive に error へ昇格させる
# （2026-07-09: 検出器が見つけられる語を手書きで複写していた設計を廃止）。
[deny]

[codemix]
threshold = 8.0

[coinage]
# 実コーパスの語彙表（mise run setup:corpus が jawiki 記事タイトル ~2.4M 語を配置）。
# 辞書に無い複合を corpus 照合: 在る（物理層）→ 自然として消す / 無い（機械床）→ error。
corpus = "~/.cache/correo/corpus.tsv"

[kinoshita]
max-sentence = 100
max-ten = 4
