#:schema ./schemas/correo.schema.json
# correo.toml — correo 自身の設定（dogfood）。`correo check` が cwd から根へ辿って自動発見する。
# 上の #:schema は taplo / tombi（TOML の language server）が読む directive — biome.json の
# "$schema" と同じ役割で、エディタ補完と検証が効く（correo 自身は無視する・ただのコメント）。
#
# allow への登録は judge（人か LLM）の裁定を経た語だけ。登録は造語の逃げ場ではない —
# 書き直せる語は書き直す。撤回の記録（2026-07-09）: 機械床・判定床・木下軸・行群・層別・家造語・
# 機械判定可能層 は登録や本文使用が却下され、標準的な日本語へ書き直した。
# 一回きりの言及は登録せず inline 抑制（<!-- correo-ignore -->）で逃がす。

allow = [
  # 製品・検出器・規則・設定キーの名前（README が自身の規則を説明するのに使う）
  "correo", "codemix", "coinage", "readability", "calque", "sudachi", "prh",
  "structure", "density", "deny", "allow", "cache", "slop-phrase", "denied-term", "style",
  # 分野の用語
  "slop", "locate", "judge", "llm-judge", "advisory", "blocking", "severity",
  "finding", "schema", "structured output", "allow-list", "latin", "code-switching",
  "domain", "pinned", "gratuitous", "tier", "proxy", "flag", "emit",
  "fence", "inline", "bullet", "exit", "output", "code", "cwd", "directive",
  # 他製品・形式の名前（README が言及する）
  "biome", "taplo", "tombi", "cargo", "mise", "rust", "toml", "json",
  "vale", "textlint", "node", "js", "go", "lint",
  # 書き換えずに使うと裁定した語（俗称として定着・言い換えると通じない）
  "ルー語", "ルー語密度",
  # 実在する複合語だが Sudachi の C 単位に無い語（strict の既知の誤検出。使用例・語彙表 級の
  # 生産的複合は corpus 語彙表にも載らない — 実測 2026-07-09 — ため、ここで裁定する）
  "日本語実用文", "実用文", "見出し語", "混種語", "登録語", "生成文", "字未満",
  "辞書見出し語", "辞書外複合", "語彙表", "使用例", "安全側", "技術文", "生成側", "品質側", "常用語",
]

# deny ＝ judge の確定裁定の永続 cache。組み込みの LLM 常套句（deny/slop-phrase・架け橋となる 等）
# は binary 同梱 — 解除したい語は allow に書く。検出は coinage が proactive に行う（advisory）が、
# 「機械床 は造語・使用例 は自然」の最終判定は意味の領分＝judge にしかできない
# （有限語彙表では生産的複合と区別不能 — full lex 387万語で 使用例=0 を実測・2026-07-09）。
# judge が却下した語をここへ書くと、以後の再侵入は HARD（exit 1）で機械が阻止する。
[deny]
"機械床" = "「機械的に判定できる lint」など標準的な言い方へ書き直す"
"判定床" = "「判定の条件」へ書き直す"
"木下軸" = "「木下原則の検査」へ書き直す"
"家造語" = "「独自の造語」へ書き直す"
"行群" = "「まとまり」へ書き直す"
"corpus語彙表" = "「corpus（語彙表）」のように区切って書く"

[codemix]
threshold = 8.0
# カタカナ語彙表 = data（metaphor-lexicon と同じ契約・suggestion enrichment 専用で発火には不関与）
katakana-lexicon = "lexicons/katakana-lex.tsv"

[coinage]
# 実コーパスの語彙表（mise run setup:corpus が jawiki 記事タイトル ~2.4M 語を配置）。
# 辞書に無い複合を corpus 照合: 在る（物理層）→ 自然として消す / 無い（機械床）→ error。
corpus = "~/.cache/correo/corpus.tsv"

[readability]
max-sentence = 100
max-ten = 4

# メタファー語彙表 = data（機構でも hardcode でもない・裁定記録は file 内 comment）
[rhetoric]
metaphor-lexicon = "lexicons/metaphor-lex.tsv"
