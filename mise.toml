# correo — mise task runner。
# [tools] は宣言しない: Rust toolchain は既存の cargo/rustup をそのまま使う（mise 管理外）。
# 命名規則(wiring-mise-tasks 契約): 区切りは ":" のみ。形は <domain>:<action>。do/verify は X + X:check。check = 全 gate 集約。
# setup は意図的に無い（cargo が build 時に依存解決・Rust 方式。setup:* は任意の辞書/hook 導入）:
# mise-contract: waive setup -- cargo resolves deps at build; setup:* are optional dict/hook installs

[tasks.fmt]
alias = "f"                                        # ← `mise run f` はこの alias で解決する（要件）
description = "Rust source を rustfmt で整形"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "整形チェック（CI 用・非破壊）"
run = "cargo fmt --all -- --check"

[tasks.lint]
alias = "l"
description = "clippy 静的解析（全 target/feature・warning を deny）"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
alias = "t"
description = "cargo test（codemix は無辞書で走る; coinage は要 Sudachi 辞書）"
run = "cargo test"

[tasks.build]
description = "release build（配布 binary）"
run = "cargo build --release"

# 依存の一括最新化。cargo 標準の update は Cargo.lock しか触らないので、Cargo.toml の
# 要求バージョン自体を上げる cargo-edit（cargo upgrade）を使う。無ければ自動導入。
# --incompatible で major を跨いだ最新まで上げる（git tag 固定の sudachi は対象外）。
# 破壊は後段の check が捕える運用: 実行後は必ず mise run check で検収する。
[tasks.up]
alias = "u"
description = "依存を最新へ一括更新（Cargo.toml の要求を最新 major へ + Cargo.lock 同期）。実行後は mise run check"
run = '''
command -v cargo-upgrade >/dev/null 2>&1 || cargo install cargo-edit
cargo upgrade --incompatible allow
cargo update
'''

[tasks."up:check"]
description = "依存更新の dry-run（Cargo.toml を書き換えず更新候補を一覧）"
run = '''
command -v cargo-upgrade >/dev/null 2>&1 || cargo install cargo-edit
cargo upgrade --incompatible allow --dry-run
'''

[tasks."lint:self"]
description = "dogfood: correo で repo 内の *.md を全部 lint（引数ゼロ＝walker・設定は correo.toml 自動発見。readability HARD が ratchet・coinage の新語は advisory に浮いて裁定を待つ）"
run = "cargo run --quiet -- check"

# 集約 gate（CI 相当）。cargo check は入れない: clippy がコンパイル＋lint を兼ねる上位互換ゆえ重複。
[tasks.check]
alias = "c"
description = "全 gate 集約: fmt:check + lint + test + lint:self + version:check"
depends = ["fmt:check", "lint", "test", "lint:self", "version:check"]

# version 規約（CalVer 0.YYMM.z）の機械 gate。規則は prose でなく hook が持つ:
# 「出荷物（src/・lexicons/・Cargo.toml・Cargo.lock）が最終 release tag から変化しているなら
#  version は tag より厳密に大きい」。正本 script は .githooks/pre-commit（one home）。
[tasks."version:check"]
description = "version-guard: 出荷物が最終 release tag から変化しているなら bump 済みであることを検査（pre-commit と同じ・作業樹基準）"
run = "sh .githooks/pre-commit --worktree"

[tasks."setup:hooks"]
description = "repo の git hooks を有効化（core.hooksPath → .githooks・version-guard が commit 時に効く）"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath = .githooks'"

[tasks.bump]
description = "version の z を進める（同月なら z+1・月替わりなら 0.YYMM.0）。tag より既に進んでいれば no-op。CalVer next の計算はこのタスクだけが持つ"
run = '''
tag=$(git describe --tags --abbrev=0 --match 'v*'); tag_ver=${tag#v}
ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
if [ "$ver" != "$tag_ver" ] && [ "$(printf '%s\n%s\n' "$tag_ver" "$ver" | sort -V | tail -n1)" = "$ver" ]; then
  echo "already bumped: $ver > $tag_ver"; exit 0
fi
yymm=$(date +%y%m)
case "$tag_ver" in
  0.$yymm.*) next="0.$yymm.$(( ${tag_ver##*.} + 1 ))" ;;
  *)         next="0.$yymm.0" ;;
esac
command -v cargo-set-version >/dev/null 2>&1 || cargo install cargo-edit
cargo set-version "$next"
cargo check --quiet
echo "bumped: $ver -> $next"
'''

[tasks."setup:sudachidict"]
description = "Sudachi 辞書(core) を sudachidict-core wheel から ~/.cache/correo へ抽出（coinage の live エンジン用・resolve_dict_dir の最終 fallback と一致・要 uv）"
run = '''
mkdir -p ~/.cache/correo
uv run --with sudachipy --with sudachidict-core python -c "
import sudachidict_core, sudachipy, pathlib, shutil
dst = pathlib.Path.home() / '.cache' / 'correo'
shutil.copy(pathlib.Path(sudachidict_core.__file__).parent / 'resources' / 'system.dic', dst / 'system.dic')
for f in (pathlib.Path(sudachipy.__file__).parent / 'resources').iterdir():
    if f.is_file():
        shutil.copy(f, dst / f.name)
print('correo dict ready:', dst)"
'''

[tasks."setup:corpus"]
description = "coinage の corpus 照合用語彙表を構築（SudachiDict full lex CSV の全表層 ∪ jawiki 記事タイトル → ~/.cache/correo/corpus.tsv）。lex CSV は辞書編纂者が実在を裁定済みの語彙 — core 辞書の C 単位に無い複合（使用例・実用文）を実在側へ救い、真の造語（機械床）だけを error に残す。BCCWJ 長単位語彙表（doi.org/10.15084/00003212）へ差し替え可"
run = '''
mkdir -p ~/.cache/correo
T=$(mktemp -d)
curl -sL https://dumps.wikimedia.org/jawiki/latest/jawiki-latest-all-titles-in-ns0.gz \
  | gunzip | sed 's/_/ /g' > "$T/words"
for f in core_lex notcore_lex; do
  curl -sL "http://sudachi.s3-ap-northeast-1.amazonaws.com/sudachidict-raw/20260428/${f}.zip" -o "$T/$f.zip"
  unzip -p "$T/$f.zip" | cut -d, -f1 >> "$T/words"
done
sort -u "$T/words" > ~/.cache/correo/corpus.tsv
rm -rf "$T"
wc -l ~/.cache/correo/corpus.tsv
'''

[tasks.install]
description = "correo を local に install（cargo install --path .）"
run = "cargo install --path ."
