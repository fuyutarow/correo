[package]
name = "correo"
version = "0.1.0"
edition = "2024"
description = "日本語実用文の lint ── LLM slop（ルー語 codemix・造語/混種語 coinage・動詞カルク）と、木下是雄の原則のうち機械的に判定できるもの（kinoshita: 文長・読点・文体混在・二重否定・ぼかし・指示語）。事実性・hype は対象外。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fuyutarow/correo"

[lib]
name = "correo"

[[bin]]
name = "correo"
path = "src/main.rs"

[dependencies]
regex = "1"                                       # codemix 密度・calque の正規表現
anyhow = "1"                                       # coinage の error-model（Result<i32>）
# crates.io 未公開のため公式 repo の tag を pin。coinage feature を明示した時のみ引き込む。
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.6.11", optional = true }
clap = { version = "4", features = ["derive"] }   # CLI 引数（user 指定: 手書き parse を廃し robust parsing + --help 生成。軽量 argh/lexopt より UX 優先）
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
ignore = "0.4.27"

[features]
# 汎用ツールとして coinage（形態素の造語検出）を既定で有効化。--no-default-features で純 codemix。
default = ["coinage"]
coinage = ["dep:sudachi"]

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"   # allow-list registry の一時 file parse test 用
